<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="80%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Play button triangle base -->
  <path d="M120 96 L120 416 L360 256 Z" fill="url(#logoGrad)" opacity="0.9" filter="url(#glow)"/>
  <!-- Upward arrow integrated into the play shape -->
  <path d="M280 256 L360 256 L420 120 L370 120 L330 200 L290 120 L240 120 Z" fill="url(#arrowGrad)" filter="url(#glow)"/>
  <!-- Inner highlight stroke -->
  <path d="M140 120 L140 392 L340 256 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <!-- Small sparkle accent -->
  <circle cx="400" cy="112" r="8" fill="#ec4899" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="410" cy="100" r="4" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
